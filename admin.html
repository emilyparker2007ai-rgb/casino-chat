<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Casino 463</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23111b21'/><text x='50' y='68' font-size='40' text-anchor='middle' fill='%230b7d6e' font-family='Arial' font-weight='bold'>463</text></svg>">
<style>
  :root{ --header:#0b7d6e; --bg:#eae4dc; --panel:#fff; --line:#e2e2e2; --ink:#111b21; --muted:#667781;
    --in:#fff; --out:#d6f5cf; --unread:#25d366; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); }
  #login{ height:100dvh; display:flex; align-items:center; justify-content:center; background:#111b21; }
  #login .box{ background:#fff; padding:28px; border-radius:14px; width:300px; text-align:center; }
  #login h1{ font-size:20px; margin:0 0 4px; } #login p{ color:var(--muted); font-size:13px; margin:0 0 16px; }
  #login input{ width:100%; padding:12px; border:1px solid var(--line); border-radius:9px; font-size:15px; margin-bottom:10px; }
  #login button{ width:100%; padding:12px; border:0; border-radius:9px; background:var(--header); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  #app{ display:none; height:100dvh; grid-template-columns:340px 1fr; }
  .side{ border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; background:var(--panel); }
  .side .h{ background:var(--header); color:#fff; padding:14px 16px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .side .h small{ opacity:.85; font-weight:400; }
  .list{ flex:1 1 auto; overflow-y:auto; }
  .item{ padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:10px; align-items:center; }
  .item:hover{ background:#f5f5f5; } .item.active{ background:#e9f5ef; }
  .item .ava{ width:42px; height:42px; border-radius:50%; background:var(--header); color:#fff; display:grid; place-items:center; font-weight:700; flex:0 0 auto; }
  .item .mid{ flex:1 1 auto; min-width:0; }
  .item .nm{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .ls{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .rt{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:0 0 auto; }
  .item .tm{ font-size:11px; color:var(--muted); }
  .item .un{ background:var(--unread); color:#fff; font-size:11px; font-weight:700; border-radius:11px; min-width:20px; height:20px; padding:0 6px; display:grid; place-items:center; }
  .main{ display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  .empty{ flex:1 1 auto; display:grid; place-items:center; color:var(--muted); }
  .mh{ background:var(--header); color:#fff; padding:10px 16px; display:none; align-items:center; gap:12px; }
  .mh .ava{ width:40px; height:40px; border-radius:50%; background:#fff; color:var(--header); display:grid; place-items:center; font-weight:800; }
  .mh .info{ flex:1 1 auto; min-width:0; } .mh .info .n{ font-weight:600; } .mh .info .d{ font-size:12px; opacity:.9; }
  .mh .info .d a{ color:#c9f5d0; }
  .msgs{ flex:1 1 auto; overflow-y:auto; padding:16px; display:none; flex-direction:column; gap:8px; }
  .b{ max-width:70%; padding:7px 11px 5px; border-radius:9px; font-size:14.5px; line-height:1.35; box-shadow:0 1px .5px rgba(0,0,0,.12); white-space:pre-wrap; word-wrap:break-word; }
  .b.cli{ align-self:flex-start; background:var(--in); border-top-left-radius:2px; }
  .b.adm{ align-self:flex-end; background:var(--out); border-top-right-radius:2px; }
  .b .t{ font-size:10.5px; color:var(--muted); float:right; margin:6px 0 -2px 8px; }
  .rep{ display:none; padding:10px 12px; background:#f0f2f5; gap:8px; align-items:center; }
  .rep input{ flex:1 1 auto; border:1px solid var(--line); border-radius:22px; padding:11px 16px; font-size:15px; outline:0; }
  .rep button{ background:var(--header); color:#fff; border:0; border-radius:50%; width:44px; height:44px; font-size:20px; cursor:pointer; flex:0 0 auto; }
  .quick{ padding:0 12px 8px; display:none; gap:6px; flex-wrap:wrap; background:#f0f2f5; }
  .quick button{ font-size:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 10px; cursor:pointer; color:var(--ink); }
</style>
</head>
<body>
  <div id="login">
    <div class="box">
      <h1>Panel Casino 463</h1>
      <p>Ingres&aacute; la clave de operador</p>
      <input id="key" type="password" placeholder="Clave" />
      <button id="enter">Entrar</button>
    </div>
  </div>

  <div id="app">
    <div class="side">
      <div class="h"><span>Conversaciones</span><small id="count">0</small></div>
      <div class="list" id="list"></div>
    </div>
    <div class="main">
      <div class="mh" id="mh">
        <div class="ava" id="mhav">?</div>
        <div class="info"><div class="n" id="mhn">-</div><div class="d" id="mhd"></div></div>
      </div>
      <div class="empty" id="empty">Eleg&iacute; una conversaci&oacute;n para responder</div>
      <div class="msgs" id="msgs"></div>
      <div class="quick" id="quick"></div>
      <form class="rep" id="rep" autocomplete="off">
        <input id="rinp" placeholder="Escrib&iacute; tu respuesta&hellip;" autocomplete="off" />
        <button type="submit">&#10148;</button>
      </form>
    </div>
  </div>

<script>
(function(){
  var KEY=""; try{ KEY=localStorage.getItem("adminkey")||""; }catch(e){}
  var active=null, lastMsgId=0, listTimer=null, convTimer=null;

  function show(id,disp){ document.getElementById(id).style.display=disp; }
  function fmt(ts){ var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function api(path){ return "/api/admin/"+path+(path.indexOf("?")<0?"?":"&")+"key="+encodeURIComponent(KEY); }

  function login(){
    var k=document.getElementById("key").value.trim(); if(!k) return;
    KEY=k; try{ localStorage.setItem("adminkey",k); }catch(e){}
    fetch(api("list")).then(function(r){ if(r.status===401){ alert("Clave incorrecta"); return null;} return r.json(); })
      .then(function(d){ if(d&&d.ok){ start(); } });
  }
  document.getElementById("enter").addEventListener("click", login);
  document.getElementById("key").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });

  function start(){
    show("login","none"); document.getElementById("app").style.display="grid";
    loadList(); listTimer=setInterval(loadList, 3000);
  }

  function loadList(){
    fetch(api("list")).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) return; var L=d.convs||[];
      document.getElementById("count").textContent=L.length;
      var html="";
      L.forEach(function(c){
        var ini=(c.name||"?").charAt(0).toUpperCase();
        var pre=(c.from==="admin"?"Vos: ":"")+esc(c.last||"");
        html+='<div class="item'+(active===c.id?" active":"")+'" data-id="'+c.id+'">'
          +'<div class="ava">'+esc(ini)+'</div>'
          +'<div class="mid"><div class="nm">'+esc(c.name||"Sin nombre")+'</div><div class="ls">'+pre+'</div></div>'
          +'<div class="rt"><span class="tm">'+fmt(c.ts)+'</span>'+(c.unread>0?'<span class="un">'+c.unread+'</span>':'')+'</div>'
          +'</div>';
      });
      document.getElementById("list").innerHTML=html||'<div style="padding:20px;color:#667781">Todav&iacute;a no hay chats.</div>';
      [].forEach.call(document.querySelectorAll(".item"), function(el){
        el.addEventListener("click", function(){ open(el.getAttribute("data-id")); });
      });
    }).catch(function(){});
  }

  function open(id){
    active=id; lastMsgId=0;
    document.getElementById("msgs").innerHTML="";
    show("empty","none"); show("mh","flex"); show("msgs","flex"); show("rep","flex"); show("quick","flex");
    if(convTimer) clearInterval(convTimer);
    loadConv(true); convTimer=setInterval(function(){ loadConv(false); }, 2000);
    loadList();
  }

  function loadConv(first){
    if(!active) return;
    fetch(api("conv?id="+encodeURIComponent(active)+"&read=1&after="+lastMsgId)).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok) return;
      if(first){
        document.getElementById("mhav").textContent=(d.name||"?").charAt(0).toUpperCase();
        document.getElementById("mhn").textContent=d.name||"Sin nombre";
        var det=[]; if(d.phone) det.push("📱 "+esc(d.phone)); if(d.clid) det.push("anuncio: "+esc(d.clid));
        if(d.leadId) det.push('<a href="https://urquizacaja.kommo.com/leads/detail/'+d.leadId+'" target="_blank">ver en Kommo</a>');
        document.getElementById("mhd").innerHTML=det.join(" · ");
        renderQuick(d);
      }
      var box=document.getElementById("msgs");
      (d.msgs||[]).forEach(function(m){
        var b=document.createElement("div"); b.className="b "+(m.from==="admin"?"adm":"cli");
        b.innerHTML=esc(m.text)+'<span class="t">'+fmt(m.ts)+'</span>'; box.appendChild(b);
        if(m.id>lastMsgId) lastMsgId=m.id;
      });
      if((d.msgs||[]).length) box.scrollTop=box.scrollHeight;
    }).catch(function(){});
  }

  function renderQuick(d){
    var q=document.getElementById("quick"); q.innerHTML="";
    var opts=[
      "Hola! Ya te genero el usuario 🙌",
      "Tu usuario es:  |  Tu contraseña es:",
      "Link para entrar: https://ganandoen463.site/",
      "Listo, ya podés cargar y jugar 🎰"
    ];
    opts.forEach(function(t){ var b=document.createElement("button"); b.textContent=t.length>34?t.slice(0,34)+"…":t;
      b.title=t; b.addEventListener("click",function(){ document.getElementById("rinp").value=t; document.getElementById("rinp").focus(); }); q.appendChild(b); });
  }

  document.getElementById("rep").addEventListener("submit", function(ev){
    ev.preventDefault(); var t=document.getElementById("rinp").value.trim(); if(!t||!active) return;
    document.getElementById("rinp").value="";
    fetch(api("reply"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:active,text:t})})
      .then(function(r){return r.json();}).then(function(){ loadConv(false); loadList(); }).catch(function(){});
  });

  if(KEY){ fetch(api("list")).then(function(r){ return r.status===200?r.json():null; }).then(function(d){ if(d&&d.ok) start(); }); }
})();
</script>
</body>
</html>
