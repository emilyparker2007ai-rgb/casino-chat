:root{

  --wa:#25d366; --wa-2:#0f9d4f;
  --bg:#000; --ink:#fff; --mut:#a9a29a; --line:#241c0c; --card:#0d0b07;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#060402;color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55;
  min-height:100dvh;overflow-x:hidden;position:relative;
  background-image:
    radial-gradient(110% 62% at 50% 34%,transparent 34%,rgba(0,0,0,.78) 100%),
    radial-gradient(70% 34% at 50% 9%,rgba(255,196,78,.42) 0%,rgba(255,150,30,.13) 40%,transparent 68%),
    linear-gradient(180deg,#3a2607 0%,#1c1204 30%,#0a0603 62%,#060402 100%);
  background-attachment:fixed}

/* orbes dorados desenfocados: dan profundidad y no cuestan nada */
body::before{content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle 190px at 14% 20%,rgba(255,188,60,.22),transparent 70%),
    radial-gradient(circle 130px at 88% 13%,rgba(255,214,110,.18),transparent 70%),
    radial-gradient(circle 230px at 78% 52%,rgba(214,150,40,.15),transparent 72%),
    radial-gradient(circle 150px at 8% 62%,rgba(255,180,60,.13),transparent 72%),
    radial-gradient(circle 110px at 62% 84%,rgba(255,200,80,.10),transparent 72%);
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

/* destellos finos */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(2px 2px at 12% 14%,rgba(255,228,160,.95),transparent 60%),
    radial-gradient(1.6px 1.6px at 83% 9%,rgba(255,215,130,.85),transparent 60%),
    radial-gradient(2.4px 2.4px at 68% 26%,rgba(255,236,180,.75),transparent 60%),
    radial-gradient(1.4px 1.4px at 26% 33%,rgba(255,215,130,.8),transparent 60%),
    radial-gradient(2px 2px at 93% 41%,rgba(255,224,150,.6),transparent 60%),
    radial-gradient(1.6px 1.6px at 6% 46%,rgba(255,215,130,.65),transparent 60%),
    radial-gradient(2.2px 2.2px at 45% 5%,rgba(255,240,190,.9),transparent 60%),

    radial-gradient(1.5px 1.5px at 17% 76%,rgba(255,224,150,.4),transparent 60%);
  animation:tw 7s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:.7}}

.wrap{position:relative}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 132px}

/* ---------- logo ---------- */
.logo-wrap{position:relative;margin:4px auto 0;max-width:430px}
.logo-wrap::before{content:"";position:absolute;left:50%;top:50%;width:118%;height:150%;transform:translate(-50%,-50%);

.logo{position:relative;display:block;width:100%;height:auto;mix-blend-mode:screen}
.tag{text-align:center;font-family:var(--disp);font-size:13px;letter-spacing:.42em;color:var(--gold);
  text-transform:uppercase;margin:2px 0 22px;text-indent:.42em}

/* ---------- oferta ---------- */
.offer{text-align:center;margin-bottom:6px}
.offer .l1{font-family:var(--disp);font-size:clamp(21px,6.2vw,29px);line-height:1.04;letter-spacing:.5px;text-transform:uppercase;color:#fff}
.pct{font-family:var(--disp);font-size:clamp(76px,24vw,124px);line-height:1.02;letter-spacing:-2px;margin:-2px 0 0;padding:.04em 0 .1em;overflow:visible;
  background:linear-gradient(180deg,#fff7d6 0%,var(--gold) 42%,var(--gold-2) 74%,var(--gold-3) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold);
  filter:drop-shadow(0 6px 20px rgba(255,176,32,.32))}
.sub{text-align:center;color:var(--mut);font-size:15px;margin:8px auto 20px;max-width:330px}
.sub b{color:#fff}

/* ---------- selector de monto ---------- */
.expl{text-align:center;margin:16px auto 20px;max-width:340px;font-size:15px;color:var(--mut);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(20,14,4,.55);line-height:1.5}
.expl b{color:var(--gold)}
.q{text-align:center;font-weight:700;font-size:15px;margin:0 0 10px}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.amt{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:13px;padding:13px 4px;font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s}
.amt small{display:block;font-weight:600;font-size:11px;color:var(--mut);margin-top:2px}
.amt[aria-pressed="true"]{border-color:var(--gold);background:#1a1408;color:var(--gold)}
.amt[aria-pressed="true"] small{color:var(--gold-2)}
.amt:active{transform:scale(.97)}

/* ---------- CTA ---------- */
.cta{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;
  border:0;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2ee878,var(--wa-2));color:#04240f;border-radius:16px;padding:17px 18px;
  font-family:var(--sans);font-weight:800;box-shadow:0 10px 30px rgba(37,211,102,.32),inset 0 1px 0 rgba(255,255,255,.4);
  animation:pulse 2.4s ease-in-out infinite}
.cta b{font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
.cta span{font-size:12.5px;font-weight:700;opacity:.85}
.cta svg{width:21px;height:21px;fill:#04240f;flex:0 0 auto}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(37,211,102,.3),inset 0 1px 0 rgba(255,255,255,.4)}
  50%{box-shadow:0 10px 40px rgba(37,211,102,.6),inset 0 1px 0 rgba(255,255,255,.4)}}

/* ---------- confianza ---------- */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 6px;text-align:center;font-size:12.5px;color:var(--mut);line-height:1.3}
.chip b{display:block;color:var(--gold);font-size:14px;margin-bottom:1px}
.rows{margin:22px 0 0;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:13px 16px;font-size:14.5px}
.row+.row{border-top:1px solid var(--line)}
.row i{font-style:normal;font-size:17px;width:22px;text-align:center;flex:0 0 auto}
.row b{color:var(--gold)}
.bonus{margin:16px 0 0;border:1px solid var(--line);border-radius:15px;padding:16px 18px;background:linear-gradient(180deg,#140f05,#0a0805)}
.bonus h2{font-family:var(--disp);font-size:16px;letter-spacing:.16em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
.bonus ul{margin:0;padding:0;list-style:none}
.bonus li{font-size:14.5px;color:var(--mut);padding:5px 0 5px 20px;position:relative}
.bonus li::before{content:"+";position:absolute;left:2px;color:var(--gold);font-weight:800}
.bonus li b{color:#fff}
.auto{text-align:center;margin:16px auto 0;max-width:340px;font-size:14px;font-weight:700;color:var(--gold);
  border:1px solid rgba(255,210,74,.28);border-radius:12px;padding:11px 14px;background:rgba(255,190,60,.07)}
.auto b{color:#fff}
.foot{text-align:center;color:#7d7368;font-size:12px;margin-top:14px}
.foot b{color:#8d8377}

/* ---------- sticky mobile ---------- */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(0,0,0,0),#000 38%);display:none}
.sticky .cta{border-radius:14px;padding:15px}
@media (max-width:820px){.sticky{display:block}}
@media (prefers-reduced-motion:reduce){.cta,body::before,body::after{animation:none}}
</style>
